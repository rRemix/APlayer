#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Mon Nov 10 17:55:08 CST 2025
# 临时兼容开关：AGP 9.0 移除了旧的 BaseExtension/Variant API，
# 部分第三方插件（如 androidx.baselineprofile 1.4.1）尚未适配新 DSL，
# 通过此开关恢复旧 DSL。注意：该开关将在 AGP 10.0 移除，
# 待 baselineprofile 发布 AGP 9 兼容版本后应移除本行。
android.newDsl=false
# 临时兼容开关：AGP 9.0 内置 Kotlin 不允许 KSP 等插件用 kotlin.sourceSets 添加生成源码目录，
# 需此开关放行。AGP 10.0 将移除，待 KSP 适配新 sourceSet API 后应移除本行。
android.disallowKotlinSourceSets=false
android.nonTransitiveRClass=false
android.useAndroidX=true
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true